<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPad Clock</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            -webkit-user-select: none;
        }
        #clock {
            font-size: 13vw;
            font-weight: 300;
            letter-spacing: -2px;
            margin: 0;
            line-height: 1;
            text-align: center;
        }
        #seconds {
            font-size: 0.4em;
            color: #666666;
            vertical-align: baseline;
        }
        #date {
            font-size: 3.5vw;
            font-weight: 400;
            color: #777777;
            margin-top: 25px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="clock">00:00<span id="seconds">:00 AM</span></div>
    <div id="date">Loading...</div>

    <script>
        function updateClock() {
            var now = new Date();
            
            var hours = now.getHours();
            var minutes = now.getMinutes();
            var seconds = now.getSeconds();
            
            var ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; // the hour '0' should be '12'
            
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            
            document.getElementById('clock').innerHTML = hours + ':' + minutes + '<span id="seconds">:' + seconds + ' ' + ampm + '</span>';
            
            var days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            var months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
            
            var dayName = days[now.getDay()];
            var monthName = months[now.getMonth()];
            var dateNum = now.getDate();
            var year = now.getFullYear();
            
            document.getElementById('date').innerHTML = dayName + ', ' + monthName + ' ' + dateNum + ', ' + year;
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
